<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown</title>
  <meta name="description" content="A polished countdown timer with configurable event details.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem("countdown.theme");
        var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = storedTheme || (prefersLight ? "light" : "dark");
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }
    }());
  </script>
  <link rel="stylesheet" href="styles.css">

    <style id="bmc-support-style">
      .bmc-support {
        display: flex; justify-content: center; align-items: center; box-sizing: border-box; width: 100%;
        margin: 0; padding: 0.55rem 1rem; border-bottom: 1px solid #e0d5bf;
        background: rgba(255, 251, 240, 0.98); color: #5b3a06; text-align: center;
        font: 600 0.9rem/1.4 system-ui, sans-serif;
      }
      .bmc-support a { color: inherit; text-decoration: none; white-space: nowrap; }
      .bmc-support a:hover, .bmc-support a:focus-visible { text-decoration: underline; text-underline-offset: 0.15em; }
      .bmc-support a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    </style>
</head>
<body class="page page-countdown">
  <div class="bmc-support"><a href="https://buymeacoffee.com/Caliche" target="_blank" rel="noopener noreferrer">☕ Buy me a coffee</a></div>

  <div class="page-shell">
    <button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch color theme" aria-pressed="false">
      <span class="theme-toggle__icon" aria-hidden="true"></span>
      <span class="theme-toggle__text" id="themeToggleText">Light</span>
    </button>

    <main class="hero-card countdown-card">
      <p class="eyebrow">Countdown in Progress</p>
      <h1 class="event-title" id="eventTitle">Coming Soon</h1>
      <p class="event-subtitle" id="eventSubtitle">The next milestone is on the clock.</p>

      <section class="countdown-panel" aria-label="Countdown timer">
        <div class="countdown-grid" id="countdownGrid">
          <article class="time-card">
            <span class="time-value" id="days">30</span>
            <span class="time-label">Days</span>
          </article>
          <article class="time-card">
            <span class="time-value" id="hours">00</span>
            <span class="time-label">Hours</span>
          </article>
          <article class="time-card">
            <span class="time-value" id="minutes">00</span>
            <span class="time-label">Minutes</span>
          </article>
          <article class="time-card">
            <span class="time-value" id="seconds">00</span>
            <span class="time-label">Seconds</span>
          </article>
        </div>

        <div class="status-card is-hidden" id="expiredState" aria-live="polite">
          <p class="status-label">Countdown Complete</p>
          <h2 class="status-title">It's time!</h2>
          <p class="status-copy">The scheduled moment has arrived.</p>
        </div>
      </section>

      <div class="meta-row">
        <div class="meta-block">
          <span class="meta-label">Target</span>
          <span class="meta-value" id="targetDisplay">Loading...</span>
        </div>
      </div>
    </main>


    <a class="admin-link" href="admin.html">Admin</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
